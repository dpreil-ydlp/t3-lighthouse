name: CI

# Every push is tested. A pull request is tested only when it comes from a fork, because a
# branch in this repository was already tested on push.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secrets for the test stack
        run: |
          mkdir -m 700 secrets
          for f in db-password dashboard-session-key t3-webhook-hmac; do openssl rand -hex 32 | tr -d '\n' > secrets/$f; done
          chmod 600 secrets/*
      - name: Start PostgreSQL and the API from source
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait db api
      - name: Migrations
        run: docker compose logs migrate
      - name: Run the API test suite
        run: docker compose exec -T api run-tests
      - if: failure()
        run: docker compose logs

  collector:
    name: Collector tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest collector/tests

  dashboard:
    name: Dashboard build and tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: node tests/test_brief_render.cjs && node tests/test_session_key.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sign-in and layout tests in a browser (Playwright)
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
          python -m pytest tests/test_auth.py

  installer:
    name: Installer lint and tests (${{ matrix.os }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck install.sh bin/lighthouse scripts/install-mac-collector.sh tests/installer/run.sh
      - run: bash tests/installer/run.sh
